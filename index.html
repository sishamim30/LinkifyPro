<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LinkifyPro - Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='12057132' data-sdk='show_12057132'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f8fafc; padding-bottom: 80px; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent;}
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.25rem; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .primary-gradient { background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%); }
        .success-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .nav-item { color: #64748b; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-item.active { color: #60a5fa; transform: translateY(-4px); }
        .nav-item.active .nav-icon { background: rgba(96, 165, 250, 0.15); color: #60a5fa; box-shadow: 0 0 15px rgba(96, 165, 250, 0.2); }
        .ad-timer-circle { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="ui-loading" class="fixed inset-0 flex flex-col items-center justify-center bg-[#0f172a] z-50">
        <i class="fa-solid fa-bolt text-5xl text-indigo-500 mb-4 animate-pulse"></i>
        <h2 class="text-2xl font-bold text-white mb-2" id="loading-title">LinkifyPro</h2>
        <p class="text-slate-400 text-sm" id="loading-text">Connecting to servers...</p>
    </div>

    <!-- MAIN APP UI -->
    <div id="ui-main-app" class="hidden">
        <header class="flex items-center justify-between p-4 glass-panel m-4 sticky top-4 z-30">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-full primary-gradient flex items-center justify-center shadow-lg"><i class="fa-solid fa-bolt text-white text-lg"></i></div>
                <div><h1 class="font-bold text-lg text-white leading-tight">LinkifyPro</h1><p class="text-[11px] text-indigo-300" id="user-greeting">Loading...</p></div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-800/80 py-2 px-4 rounded-full border border-slate-700 shadow-inner">
                <i class="fa-solid fa-wallet text-emerald-400"></i><span class="font-bold text-sm text-emerald-400" id="header-balance">$0.00</span>
            </div>
        </header>

        <div id="pages-container">
            <!-- PAGE: HOME -->
            <div id="page-home" class="page-content fade-in">
                <div class="mx-4 mb-6 p-6 glass-panel relative overflow-hidden">
                    <h2 class="text-xs font-bold text-indigo-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-link mr-2"></i> Create Short Link</h2>
                    <input type="url" id="long-url-input" placeholder="Paste your long URL here..." class="w-full bg-slate-900/80 border border-slate-700 text-white rounded-xl p-4 mb-4 focus:outline-none focus:border-indigo-500 transition-colors text-sm shadow-inner">
                    <button id="btn-shorten" class="w-full primary-gradient hover:opacity-90 text-white font-bold py-4 rounded-xl flex items-center justify-center space-x-2 shadow-lg shadow-indigo-500/25 transition-transform active:scale-95">
                        <i class="fa-solid fa-wand-magic-sparkles"></i><span>Shorten & Earn</span>
                    </button>
                    <div id="shorten-result" class="hidden mt-5 p-2 bg-gradient-to-r from-emerald-500/20 to-teal-500/20 border border-emerald-500/30 rounded-xl">
                        <div class="flex justify-between items-center bg-slate-900 rounded-lg p-3">
                            <span id="short-link-display" class="text-sm font-mono text-emerald-400 truncate w-[80%]"></span>
                            <button id="btn-copy-link" class="bg-slate-800 w-10 h-10 rounded-lg text-emerald-400 flex items-center justify-center hover:bg-slate-700 transition-colors"><i class="fa-solid fa-copy"></i></button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mx-4 mb-6">
                    <div class="glass-panel p-5 text-center relative overflow-hidden">
                        <div class="text-slate-400 text-xs mb-1 uppercase font-semibold">Today's Earn</div><div class="text-2xl font-bold text-emerald-400" id="stat-today-earn">$0.00</div>
                    </div>
                    <div class="glass-panel p-5 text-center relative overflow-hidden">
                        <div class="text-slate-400 text-xs mb-1 uppercase font-semibold">Total Views</div><div class="text-2xl font-bold text-white" id="stat-views">0</div>
                    </div>
                </div>
            </div>
            <!-- Other pages remain unchanged -->
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="fixed bottom-0 left-0 w-full bg-[#0f172a]/95 backdrop-blur-xl border-t border-slate-800 z-40 pb-safe">
            <div class="flex justify-between items-end px-2 pt-2 pb-3">
                <button class="nav-btn nav-item active flex flex-col items-center w-1/5" data-target="page-home"><div class="nav-icon w-10 h-10 rounded-xl flex items-center justify-center text-lg mb-1"><i class="fa-solid fa-house"></i></div><span class="text-[10px]">Home</span></button>
            </div>
        </nav>
    </div>

    <!-- AD VIEWING UI -->
    <div id="ui-ad-viewer" class="hidden min-h-screen flex flex-col items-center justify-center p-6 z-50">
        <div class="glass-panel w-full max-w-sm p-8 text-center shadow-2xl relative overflow-hidden">
            <div id="ad-timer-container" class="w-24 h-24 mx-auto rounded-full bg-slate-900 border-4 border-slate-700 flex items-center justify-center mb-6">
                <span id="ad-timer-text" class="text-3xl font-bold text-white">5</span>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-white" id="ad-step-title">Please Wait...</h2>
            <button id="btn-watch-ad" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-4 rounded-xl shadow-lg"><span>Wait for Timer...</span></button>
            <button id="btn-get-link" class="hidden w-full success-gradient text-white font-bold py-4 rounded-xl text-lg shadow-lg shadow-emerald-500/30"><i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> GET LINK</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vmikbelinumdgynvoumw.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_VjvBO3Rpxj4mYYX95cjPRA_Z3SoJ-VB';
        const VERCEL_API_URL = 'https://linkifypro.vercel.app/api'; 
        const BOT_USERNAME = 'linkifypro_bot'; 
        const APP_SHORT_NAME = 'httpslinkifyprovercelapp'; 

        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserData = null;
        
        const tg = window.Telegram.WebApp;
        tg.expand();

        function safeAlert(msg) { try { tg.showAlert(msg); } catch(e) { alert(msg); } }
        function copyText(text) {
            const el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select();
            document.execCommand('copy'); document.body.removeChild(el); safeAlert("Copied!");
        }

        async function initApp() {
            let startParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('link');
            
            if (tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                
                // 1. চেক করবো ইউজার আছে কিনা
                let { data: existUser } = await dbClient.from('users').select('*').eq('telegram_id', user.id).single();

                // 2. যদি না থাকে, নতুন ইউজার বানাবো
                if (!existUser) {
                    await dbClient.from('users').insert([{ telegram_id: user.id, first_name: user.first_name, username: user.username }]);
                    // আবার ফেচ করে ডাটা আনবো যাতে আইডি null না থাকে
                    const { data: newUser } = await dbClient.from('users').select('*').eq('telegram_id', user.id).single();
                    currentUserData = newUser;
                } else {
                    currentUserData = existUser;
                }
            }

            if (startParam && startParam.startsWith('link_')) {
                window.currentShortId = startParam.replace('link_', '');
                startAdFlow();
            } else {
                document.getElementById('ui-loading').classList.add('hidden');
                document.getElementById('ui-main-app').classList.remove('hidden');
                setupDashboard();
            }
        }

        function setupDashboard() {
            if(currentUserData) {
                document.getElementById('user-greeting').innerText = `Hello, ${currentUserData.first_name || 'User'}!`;
                document.getElementById('header-balance').innerText = `$${parseFloat(currentUserData.balance || 0).toFixed(4)}`;
                document.getElementById('stat-today-earn').innerText = `$${parseFloat(currentUserData.today_earnings || 0).toFixed(4)}`;
                document.getElementById('stat-views').innerText = currentUserData.total_clicks || 0;
            }

            document.getElementById('btn-shorten').addEventListener('click', async function() {
                const url = document.getElementById('long-url-input').value.trim();
                if (!url.startsWith('http')) return safeAlert("Invalid URL"); 
                this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; this.disabled = true;
                try {
                    const shortId = Math.random().toString(36).substring(2, 8);
                    // এখানে currentUserData.id ব্যবহার হচ্ছে, তাই এটি null হবে না
                    await dbClient.from('links').insert([{ original_url: url, short_id: shortId, user_id: currentUserData.id }]);
                    document.getElementById('short-link-display').innerText = `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=link_${shortId}`;
                    document.getElementById('shorten-result').classList.remove('hidden');
                } catch (e) { safeAlert("Error generating link."); } 
                finally { this.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i><span>Shorten & Earn</span>'; this.disabled = false; }
            });

            document.getElementById('btn-copy-link').addEventListener('click', () => copyText(document.getElementById('short-link-display').innerText));
        }

        function startAdFlow() {
            document.getElementById('ui-loading').classList.add('hidden'); 
            document.getElementById('ui-ad-viewer').classList.remove('hidden'); 
            
            let timeLeft = 5;
            const btn = document.getElementById('btn-watch-ad'); 
            const timerEl = document.getElementById('ad-timer-text');
            
            const interval = setInterval(() => {
                timeLeft--; timerEl.innerText = timeLeft;
                if (timeLeft <= 0) { 
                    clearInterval(interval); 
                    timerEl.innerHTML = '<i class="fa-solid fa-play text-indigo-500"></i>';
                    btn.disabled = false; 
                    btn.className = "w-full primary-gradient text-white font-bold py-4 rounded-xl shadow-lg";
                    btn.innerHTML = "Click to Watch Ad"; 
                    btn.onclick = executeAdClick;
                }
            }, 1000);
        }

        function executeAdClick() {
            if (typeof show_12057132 === 'function') { 
                show_12057132().then(() => showFinalLink()).catch(() => showFinalLink()); 
            } else {
                showFinalLink(); // If Adblocker, let them through anyway
            }
        }

        async function showFinalLink() {
            document.getElementById('btn-watch-ad').classList.add('hidden'); 
            document.getElementById('ad-timer-container').classList.add('hidden');
            document.getElementById('ad-step-title').innerText = "Link Unlocked!";
            
            const getLinkBtn = document.getElementById('btn-get-link'); 
            getLinkBtn.classList.remove('hidden');
            
            let clickerId = tg.initDataUnsafe?.user?.id || 0;
            
            try { 
                getLinkBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
                
                // BACKEND CALL FOR REWARD (Unlimited self-clicks allowed)
                await fetch(`${VERCEL_API_URL}/reward`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ short_id: window.currentShortId, clicker_tg_id: clickerId }) 
                });
                
            } catch(e) { console.error("Reward failed"); }
            
            getLinkBtn.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square mr-2"></i> GET LINK';
            
            const { data } = await dbClient.from('links').select('original_url').eq('short_id', window.currentShortId).single();
            if(data) getLinkBtn.onclick = () => tg.openLink(data.original_url);
        }

        window.onload = initApp;
    </script>
</body>
</html>
